name: render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "ID kompozycji"
        default: "StadtE02"
        required: true
      chunks:
        description: "Liczba równoległych kawałków (max 20 na darmowym planie)"
        default: "20"
        required: true
      limit:
        description: "Test: renderuj tylko pierwsze N klatek (0 = całość)"
        default: "0"
        required: false

env:
  COMP: ${{ inputs.composition }}
  REMOTION_ENTRY: cloud/index.ts

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      frames: ${{ steps.plan.outputs.frames }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Biblioteki systemowe Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with: { path: node_modules/.remotion, key: remotion-browser-${{ hashFiles('package-lock.json') }} }
      - run: npx remotion browser ensure
      - name: Bundle (raz, współdzielony przez wszystkie kawałki)
        run: npx remotion bundle $REMOTION_ENTRY --out-dir=build
      - id: plan
        run: node tools/plan.mjs build "$COMP" "${{ inputs.chunks }}" "${{ inputs.limit }}"
      - uses: actions/upload-artifact@v4
        with: { name: bundle, path: build, retention-days: 1 }

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Biblioteki systemowe Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with: { path: node_modules/.remotion, key: remotion-browser-${{ hashFiles('package-lock.json') }} }
      - run: npx remotion browser ensure
      - uses: actions/download-artifact@v4
        with: { name: bundle, path: build }
      - name: Render klatek ${{ matrix.from }}-${{ matrix.to }}
        run: |
          mkdir -p out
          npx remotion render build "$COMP" out/part_${{ matrix.idx }}.mp4 \
            --frames=${{ matrix.from }}-${{ matrix.to }} \
            --gl=swangle --concurrency=$(nproc) --muted \
            --codec=h264 --crf=16 --pixel-format=yuv420p \
            --timeout=120000 --log=info
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: part_${{ matrix.idx }}
          path: out/part_${{ matrix.idx }}.mp4
          retention-days: 3
          compression-level: 0

  concat:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "part_*", path: parts, merge-multiple: true }
      - name: Łączenie ffmpeg concat -c copy + kontrola liczby klatek
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          ls -la parts
          expected=${{ needs.plan.outputs.frames }}
          sum=0
          : > list.txt
          for f in $(ls parts/part_*.mp4 | sort); do
            n=$(ffprobe -v error -select_streams v:0 -count_packets -show_entries stream=nb_read_packets -of csv=p=0 "$f")
            echo "$f: $n klatek"; sum=$((sum + n))
            echo "file '$PWD/$f'" >> list.txt
          done
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i list.txt -c copy -movflags +faststart full.mp4
          got=$(ffprobe -v error -select_streams v:0 -count_packets -show_entries stream=nb_read_packets -of csv=p=0 full.mp4)
          echo "Suma części: $sum, full.mp4: $got, oczekiwane: $expected"
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate,pix_fmt -of default=nw=1 full.mp4
          if [ "$got" != "$expected" ]; then echo "::error::Liczba klatek $got != $expected"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: full_${{ inputs.composition }}
          path: full.mp4
          retention-days: 7
          compression-level: 0
